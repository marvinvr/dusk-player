name: Dusk
options:
  bundleIdPrefix: com.dusk-player
  deploymentTarget:
    iOS: "18.0"
    tvOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  fileTypes:
    icon: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dusk:
    type: application
    platform: iOS
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - LaunchScreen-tvOS.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-iOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/VLCKit.xcframework/ios-arm64/VLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/VLCKit.xcframework/ios-arm64-simulator/VLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/VLCKit.xcframework
        embed: true

  Dusk-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Dusk/Sources
      - path: Dusk/TopShelf/TopShelfSnapshot.swift
      - path: Dusk/TopShelf/TopShelfDeepLink.swift
      - path: Dusk/TopShelf/TopShelfCoordinator.swift
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - DuskIcon.icon
          - LaunchScreen.storyboard
          - LaunchScreen-tvOS.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        PRODUCT_NAME: Dusk
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-tvOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/VLCKit-tvOS.xcframework/tvos-arm64/VLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/VLCKit-tvOS.xcframework/tvos-arm64-simulator/VLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Dusk/Support/Dusk-tvOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusk-player.app
    dependencies:
      - framework: Frameworks/VLCKit-tvOS.xcframework
        embed: true
      - target: DuskTopShelf
        embed: true

  DuskTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: Dusk/TopShelf/TopShelfSnapshot.swift
      - path: Dusk/TopShelf/TopShelfContentProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.topshelf
        PRODUCT_NAME: DuskTopShelf
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-TopShelf.plist
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Dusk/Support/DuskTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusk-player.app
