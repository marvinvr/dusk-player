name: Dusk
options:
  bundleIdPrefix: com.dusk-player
  deploymentTarget:
    iOS: "18.0"
    tvOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  fileTypes:
    icon: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dusk:
    type: application
    platform: iOS
    # Build-time API keys (Trakt); real values come from the git-ignored
    # Dusk/Support/Secrets.xcconfig it optionally includes. See docs/trakt.md.
    configFiles:
      Debug: Dusk/Support/Keys.xcconfig
      Release: Dusk/Support/Keys.xcconfig
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - LaunchScreen-tvOS.storyboard
          # Apple TV's layered alternate icons (same names as the .icon bundles).
          - AppIconsTV.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-iOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: DuskIconDawn DuskIconMidnight DuskIconNeon DuskIconMono DuskIconAurora DuskIconGoldenHour DuskIconVelvet DuskIconEmerald DuskIconGilded DuskIconSapphire
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64/MobileVLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64-simulator/MobileVLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
      # Static Rust archive (Dolby Vision 7 -> 8.1), built by
      # ci_scripts/install_dusk_dovi.sh. Linked into the app binary, never embedded.
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded VLCKit is not stale
        basedOnDependencyAnalysis: false

  Dusk-tvOS:
    type: application
    platform: tvOS
    # Build-time API keys (Trakt); real values come from the git-ignored
    # Dusk/Support/Secrets.xcconfig it optionally includes. See docs/trakt.md.
    configFiles:
      Debug: Dusk/Support/Keys.xcconfig
      Release: Dusk/Support/Keys.xcconfig
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          # iOS Icon Composer icons; tvOS alternates are the layered image
          # stacks in AppIconsTV.xcassets (scripts/generate_tv_alternate_icons.py).
          - DuskIcon.icon
          - DuskIconDawn.icon
          - DuskIconMidnight.icon
          - DuskIconNeon.icon
          - DuskIconMono.icon
          - DuskIconAurora.icon
          - DuskIconGoldenHour.icon
          - DuskIconVelvet.icon
          - DuskIconEmerald.icon
          - DuskIconGilded.icon
          - DuskIconSapphire.icon
          - LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        # Adds the App Group the Top Shelf extension reads its snapshot from.
        # iOS keeps Dusk.entitlements, so its signing is untouched.
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk-tvOS.entitlements
        PRODUCT_NAME: Dusk
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-tvOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        # No ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES here: actool writes the iOS
        # CFBundleAlternateIcons form ({name: {CFBundleIconName}}), and App Store Connect rejects
        # that on tvOS with ITMS-90471 "missing the Alternate Icon asset". tvOS wants an array of
        # stack names, listed in Info-tvOS.plist; the top-level AppIconsTV image stacks compile
        # into Assets.car on their own. Keep that list in sync with DuskAppIcon.
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        # The global accent is the app's only tint (label color, never coral).
        # On tvOS it also matches the tab bar's tint (Color.duskTVTabBarTint), so
        # a bar that falls back to the window tint looks the same.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/TVVLCKit.xcframework/tvos-arm64/TVVLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/TVVLCKit.xcframework/tvos-arm64-simulator/TVVLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      # UIWindow.avDisplayManager is supplied by an Objective-C category in
      # AVKit. Importing AVKit is not enough to load that category at runtime.
      - sdk: AVKit.framework
      - framework: Frameworks/TVVLCKit.xcframework
        embed: true
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
      - target: DuskTopShelf
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded VLCKit is not stale
        basedOnDependencyAnalysis: false

  # Native macOS app (SwiftUI on AppKit, not Catalyst / Designed for iPad).
  # Same bundle ID as iOS/tvOS for Universal Purchase. Shares Dusk/Sources;
  # Mac-only code lives in Dusk/Sources/Mac (file-scope #if os(macOS)).
  # See docs/macos.md.
  Dusk-macOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Dusk/Support/Keys.xcconfig
      Release: Dusk/Support/Keys.xcconfig
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - LaunchScreen-tvOS.storyboard
          - LaunchScreen.storyboard
          - AppIconsTV.xcassets
          # Alternate icons are iOS/tvOS only; the Mac ships the default icon.
          - DuskIconDawn.icon
          - DuskIconMidnight.icon
          - DuskIconNeon.icon
          - DuskIconMono.icon
          - DuskIconAurora.icon
          - DuskIconGoldenHour.icon
          - DuskIconVelvet.icon
          - DuskIconEmerald.icon
          - DuskIconGilded.icon
          - DuskIconSapphire.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        PRODUCT_NAME: Dusk
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk-macOS.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Off for ad-hoc local builds: with no Team ID, hardened runtime's
        # library validation refuses the embedded VLCKit. Turn it on together
        # with real (Developer ID / App Store) signing. See docs/macos.md.
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-macOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        # No global accent on the Mac: switches, focus rings and selection follow
        # the user's System Settings accent (the system's own treatment). The
        # iOS/tvOS AccentColor (label colour) made Mac switches black/lavender.
        # "No accent for UI state" still holds: no brand tint anywhere.
        COMBINE_HIDPI_IMAGES: true
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/VLCKit.xcframework/macos-arm64_x86_64/VLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/VLCKit.xcframework
        embed: true
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded VLCKit is not stale
        basedOnDependencyAnalysis: false

  # tvOS Top Shelf: shows Continue Watching from the snapshot the app writes
  # into the shared App Group (Dusk/Sources/TopShelf). No Plex access of its own.
  DuskTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: DuskTopShelf
        excludes:
          - Info.plist
          - DuskTopShelf.entitlements
      - path: Dusk/Sources/TopShelf/TopShelfSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.topshelf
        PRODUCT_NAME: DuskTopShelf
        CODE_SIGN_ENTITLEMENTS: DuskTopShelf/DuskTopShelf.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: DuskTopShelf/Info.plist
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - sdk: TVServices.framework

  # Unit tests, hosted by the app so StoreKitTest can drive Dusk.storekit.
  DuskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DuskTests
      - path: Dusk/Support/Dusk.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dusk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dusk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Dusk

  DuskTests-tvOS:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: DuskTests
      - path: Dusk/Support/Dusk.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dusk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dusk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Dusk-tvOS

# Explicit schemes so the StoreKit configuration file is attached to Run;
# without it the supporter purchases can't be exercised in the simulator.
schemes:
  Dusk:
    build:
      targets:
        Dusk: all
    run:
      config: Debug
      storeKitConfiguration: Dusk/Support/Dusk.storekit
    test:
      config: Debug
      targets:
        - DuskTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Dusk-tvOS:
    build:
      targets:
        Dusk-tvOS: all
    run:
      config: Debug
      storeKitConfiguration: Dusk/Support/Dusk.storekit
    test:
      config: Debug
      targets:
        - DuskTests-tvOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Dusk-macOS:
    build:
      targets:
        Dusk-macOS: all
    run:
      config: Debug
      storeKitConfiguration: Dusk/Support/Dusk.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
